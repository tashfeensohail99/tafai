name: tafsheen_mobile
description: Tafsheen Immigration Solutions — Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management (plain Riverpod — no code generation)
  flutter_riverpod: ^2.5.0

  # Networking
  dio: ^5.4.0

  # Secure storage — refresh token in the keychain; access token in memory
  flutter_secure_storage: ^9.0.0

  # Local preferences
  shared_preferences: ^2.2.3

  # Date / number formatting
  intl: ^0.19.0

  # Launch tel: / wa.me / mailto: for lead quick-actions
  url_launcher: ^6.3.0

  # File picking (media send, lead file upload)
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
