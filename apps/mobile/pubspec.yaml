name: tafsheen_mobile
description: Tafsheen Immigration Solutions — Mobile App
publish_to: 'none'
version: 1.0.17+19

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management (plain Riverpod — no code generation)
  flutter_riverpod: ^2.5.0

  # Networking
  dio: ^5.4.0
  # Declared multipart content types (dio already depends on it transitively)
  http_parser: ^4.0.2

  # Secure storage — refresh token in the keychain; access token in memory
  flutter_secure_storage: ^9.0.0

  # Local preferences
  shared_preferences: ^2.2.3

  # Date / number formatting
  intl: ^0.19.0

  # Launch tel: / wa.me / mailto: for lead quick-actions
  url_launcher: ^6.3.0

  # File picking (media send, lead file upload)
  file_picker: ^8.1.0

  # NB: agreement PDFs open in the device's external browser (via url_launcher
  # above), NOT an in-app renderer. Both flutter_pdfview (SurfaceView) and pdfx
  # (texture) failed to paint on Xiaomi/HyperOS Android 15 — the page count
  # loaded but the page never rendered — so we open externally where it's
  # reliable, and deliberately bundle no in-app PDF dependency.

  # Chat media. cached_network_image caches inbound photos to disk (keyed by
  # message id, since the signed URL changes per fetch) so they don't
  # re-download on every scroll. video_player (ExoPlayer → Flutter texture —
  # reliable where the PDF SurfaceView wasn't) + chewie give in-app video
  # playback with play / seek / fullscreen controls, like WhatsApp.
  cached_network_image: ^3.3.0
  video_player: ^2.8.0
  chewie: ^1.7.0

  # ── In-app voice calling (WhatsApp Business Calling softphone) ──────────────
  # WebRTC engine — mic capture, peer connection, remote audio playback.
  flutter_webrtc: ^0.12.5
  # Socket.IO client — call signaling (ring / answered / ended) over the same
  # /whatsapp/realtime gateway the web CallDock uses.
  socket_io_client: ^2.0.3+1
  # Runtime microphone permission.
  permission_handler: ^11.3.1
  # Native incoming-call UI (Android Telecom/ConnectionService) so a call rings
  # over the lock screen when the app is backgrounded.
  flutter_callkit_incoming: ^2.5.2
  # FCM — wakes the app with a high-priority data push to ring an incoming call.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Temp dir for best-effort call recording before upload.
  path_provider: ^2.1.4
  record: ^7.1.0

  # ── Reliability & polish ────────────────────────────────────────────────────
  # Crash & error reporting — every uncaught Dart/Flutter error is sent to
  # Firebase Crashlytics (same Firebase project as FCM), so crashes on testers'
  # devices surface to us without waiting for a manual report.
  firebase_crashlytics: ^4.1.3
  # Biometric / device-credential app lock — the CRM holds client passport and
  # payment data, so it can sit behind Face ID / fingerprint.
  local_auth: ^2.3.0
  # App version + build number, for the Settings screen and the in-app update
  # check (compares against the published /public/app/info build).
  package_info_plus: ^8.1.0
  # Shimmer skeleton placeholders shown while lists load (premium feel vs a
  # bare spinner).
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates Android launcher icons (all densities + adaptive) from a PNG.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher icon — run `dart run flutter_launcher_icons` after changing the
# source PNGs (produced by tool/gen_icon.py from the in-app brand mark).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/tashfeen_icon.png"
  adaptive_icon_background: "#0D1B3A"
  adaptive_icon_foreground: "assets/icon/tashfeen_fg.png"
  min_sdk_android: 23
