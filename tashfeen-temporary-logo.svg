<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tashfeen Immigration Solutions temporary vector logo</title>
  <desc id="desc">Temporary vector logo inspired by the provided Tashfeen Immigration Solutions mark, with adaptive light and dark theme colors.</desc>
  <style>
    :root {
      --bg: #0b1f3a;
      --mark: #f8fafc;
      --mark-soft: #cbd5e1;
      --accent: #d6a84f;
      --text: #f8fafc;
      --subtext: #cbd5e1;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --mark: #0b1f3a;
        --mark-soft: #475569;
        --accent: #0e7c86;
        --text: #0b1f3a;
        --subtext: #475569;
      }
    }
    .background { fill: var(--bg); }
    .mark-main { fill: var(--mark); }
    .mark-soft { fill: var(--mark-soft); }
    .accent { fill: var(--accent); }
    .word { fill: var(--text); font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 3px; }
    .tag { fill: var(--subtext); font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 600; letter-spacing: 4px; }
  </style>

  <rect class="background" x="0" y="0" width="1200" height="420" rx="34" />

  <g transform="translate(72 74)">
    <path class="mark-soft" d="M0 0h342c-9 29-28 48-59 57H200v247h-48V57H24C13 44 5 25 0 0Z" />
    <path class="mark-main" d="M126 57h74l-37 247h-37V57Z" />
    <path class="accent" d="M154 304h46l-58 42 12-42Z" />
  </g>

  <g transform="translate(440 138)">
    <text class="word" x="0" y="62" font-size="64">TASHFEEN</text>
    <rect class="accent" x="2" y="92" width="426" height="6" rx="3" />
    <text class="tag" x="2" y="136" font-size="24">IMMIGRATION SOLUTIONS</text>
  </g>
</svg>
